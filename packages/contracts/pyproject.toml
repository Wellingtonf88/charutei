[project]
name = "charutei-contracts"
version = "0.0.0"
description = "Schemas Pydantic de I/O dos agentes e da cascata de inteligência."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charutei_contracts"]

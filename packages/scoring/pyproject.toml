[project]
name = "charutei-scoring"
version = "0.0.0"
description = "Km de Fumaça — EXPERIENCE_SCORE/KNOWLEDGE_SCORE/CONSUMER_STATUS, determinístico e sem I/O."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charutei_scoring"]

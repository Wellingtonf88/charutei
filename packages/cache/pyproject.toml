[project]
name = "charutei-cache"
version = "0.0.0"
description = "Cache exato + semântico (degrau 1 da cascata)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "charutei-contracts",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charutei_cache"]

[tool.uv.sources]
charutei-contracts = { workspace = true }

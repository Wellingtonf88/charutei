[project]
name = "charutei-location"
version = "0.0.0"
description = "Location Intelligence — ranking por distância + GeocodingProvider, sem I/O de dados (repo fica em charutei-knowledge)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "charutei-knowledge",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charutei_location"]

[tool.uv.sources]
charutei-knowledge = { workspace = true }

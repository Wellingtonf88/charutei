[project]
name = "charutei-recommendation"
version = "0.0.0"
description = "Recommendation Engine v1 — candidate generation + ranking determinístico, sem LLM."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charutei_recommendation"]

# Alembic — migrações da camada de conhecimento.
# A URL real vem de DATABASE_URL (env.py a injeta). Rode da raiz de packages/knowledge:
#   uv run --extra postgres alembic -c packages/knowledge/alembic.ini upgrade head
[alembic]
script_location = packages/knowledge/migrations
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg://charutei:charutei@localhost:5432/charutei

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

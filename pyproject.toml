[project]
name = "charutei"
version = "0.0.0"
description = "CHARUTEI — plataforma AI-First para apreciadores de charutos (modular monolith, cost-aware)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "charutei-contracts",
]

[project.optional-dependencies]
# Provedores reais ligados por slice; mockados por padrão (USE_FAKE_PROVIDERS=true).
providers = [
    "anthropic[mcp]>=0.40",
    "voyageai>=0.3",
    "google-genai>=0.3",
    "langfuse>=2.0,<3",
    # Ferramentas do laço agêntico expostas via MCP in-process (S14).
    "mcp>=1.0",
]
# Caminho Postgres (migrações + repositórios). Espelha o extra de packages/knowledge.
postgres = [
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]
# Servir o BFF localmente. Espelha o extra de services/api.
serve = [
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "httpx>=0.27",
]

[tool.uv.workspace]
# Membros adicionados conforme cada slice entrega seu pacote (S1: knowledge; S2: cache,
# orchestrator; S6: api). Mantemos só o que já existe para o sync ficar verde.
members = [
    "packages/contracts",
    "packages/knowledge",
    "packages/cache",
    "packages/events",
    "packages/scoring",
    "packages/location",
    "services/api",
    "services/orchestrator",
    "services/agents/band_recognition",
    "services/agents/assistant",
    "services/agents/cigar_intelligence",
    "services/workers/embedding",
]

[tool.uv.sources]
charutei-contracts = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "services", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI usa `Depends()/Header()` em defaults de argumento — padrão idiomático, não bug.
"services/api/**" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages", "services"]
pythonpath = ["."]
# importlib evita colisão de basenames de teste iguais entre pacotes (ex.: test_cascade.py).
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["packages", "services"]
omit = ["*/tests/*", "*/migrations/*", "*/__pycache__/*"]

[tool.coverage.report]
# Piso de cobertura no CI. Atual ~90%; 85% dá margem anti-flaky sem afrouxar demais.
# Adaptadores reais (Anthropic/Voyage/Gemini/MCP) só rodam sob chave (skipif) → contam como
# não cobertos no CI; por isso o piso fica abaixo do valor com o extra `providers`.
fail_under = 85
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# Migrações (boilerplate) e testes ficam fora do CI de tipos — o pytest os exercita,
# e basenames de teste repetidos entre pacotes colidem no resolvedor do mypy.
exclude = ["migrations/", "/tests/"]

# SDKs externos com tipagem incompleta no boundary (Voyage/Gemini): tratados como Any para
# não vazar erros de stubs de terceiros. Robusto nos dois ambientes (com/sem o extra
# `providers`); a correção real do uso vive nos adaptadores + testes de integração (skipif).
[[tool.mypy.overrides]]
module = ["voyageai", "voyageai.*", "google.genai", "google.genai.*"]
follow_imports = "skip"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Pacote raiz é só metadado do workspace; sem código próprio no MVP.
bypass-selection = true

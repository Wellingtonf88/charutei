[project]
name = "charutei-api"
version = "0.0.0"
description = "BFF/Gateway FastAPI: auth, reconhecimento de anilha e coleção."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pyjwt>=2.8",
    "charutei-contracts",
    "charutei-knowledge",
    "charutei-orchestrator",
    "charutei-band-recognition",
    "charutei-assistant",
    "charutei-cigar-intelligence",
    "charutei-events",
    "charutei-embedding-worker",
    "charutei-scoring",
    "charutei-location",
    "charutei-recommendation",
]

[project.optional-dependencies]
serve = ["uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charutei_api"]

[tool.uv.sources]
charutei-contracts = { workspace = true }
charutei-knowledge = { workspace = true }
charutei-orchestrator = { workspace = true }
charutei-band-recognition = { workspace = true }
charutei-assistant = { workspace = true }
charutei-cigar-intelligence = { workspace = true }
charutei-events = { workspace = true }
charutei-embedding-worker = { workspace = true }
charutei-scoring = { workspace = true }
charutei-location = { workspace = true }
charutei-recommendation = { workspace = true }

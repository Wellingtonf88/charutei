[project]
name = "charutei-band-recognition"
version = "0.0.0"
description = "Band Recognition Agent: foto de anilha → cigar_id (embedding→ANN→OCR→vision)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "charutei-contracts",
    "charutei-knowledge",
    "charutei-orchestrator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charutei_band_recognition"]

[tool.uv.sources]
charutei-contracts = { workspace = true }
charutei-knowledge = { workspace = true }
charutei-orchestrator = { workspace = true }

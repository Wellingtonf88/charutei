[project]
name = "charutei-embedding-worker"
version = "0.0.0"
description = "Embedding Worker: consome eventos e materializa embeddings (idempotente, com cache)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "charutei-contracts",
    "charutei-events",
    "charutei-cache",
    "charutei-orchestrator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charutei_embedding_worker"]

[tool.uv.sources]
charutei-contracts = { workspace = true }
charutei-events = { workspace = true }
charutei-cache = { workspace = true }
charutei-orchestrator = { workspace = true }

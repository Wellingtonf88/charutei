[project]
name = "charutei-orchestrator"
version = "0.0.0"
description = "Orchestrator: Router determinístico, Registry, Governance e cascata de inteligência."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "charutei-contracts",
    "charutei-cache",
    "charutei-knowledge",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charutei_orchestrator"]

[tool.uv.sources]
charutei-contracts = { workspace = true }
charutei-cache = { workspace = true }
charutei-knowledge = { workspace = true }
